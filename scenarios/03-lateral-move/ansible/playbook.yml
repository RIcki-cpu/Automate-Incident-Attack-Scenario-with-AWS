---
# Configures the WEB host (A) only. This is where Ansible earns its (here
# modest) place: it plants the leaked pivot private key on the bastion,
# modelling the very common mistake of leaving a reusable private key on a
# jump host.
#
# The INTERNAL host (B) is NOT configured here — it sets itself up at boot
# via Terraform user_data (authorizes the pivot key + stages the decoy).
# That is deliberate: nothing ever SSHes into B to configure it, so the only
# web->internal SSH flow VPC Flow Logs ever record is the attack. If Ansible
# reached B by hopping through A, that setup traffic would be
# indistinguishable from the attack in the flow logs.
#
# The pivot private key comes from `terraform output` — scripts/configure.sh
# writes it to the gitignored keys/ dir before running this playbook.
#
# (For a real, scalable way to manage a private host like B without a
# standing SSH hole, see the SSM Session Manager note in the scenario README
# / docs/technical-design.md — that's the best-practice management path.)

- name: Configure the web (bastion) host
  hosts: web
  become: true
  vars:
    pivot_private_key_src: "{{ playbook_dir }}/keys/pivot_key"
  tasks:
    - name: Ensure ec2-user .ssh dir exists
      ansible.builtin.file:
        path: /home/ec2-user/.ssh
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0700"

    - name: Leave the (deliberately leaked) pivot private key on the bastion
      ansible.builtin.copy:
        src: "{{ pivot_private_key_src }}"
        dest: /home/ec2-user/.ssh/pivot_key
        owner: ec2-user
        group: ec2-user
        mode: "0600"
