# Ansible config for this scenario. Kept lab-simple:
#   - host_key_checking off so first-connect to fresh EC2 hosts doesn't
#     prompt (fine for throwaway lab instances; you would NOT do this in
#     production).
#   - the inventory is generated from `terraform output` by
#     scripts/configure.sh (never hand-edited).
[defaults]
host_key_checking = False
inventory = inventory.ini
interpreter_python = auto_silent

[ssh_connection]
# Reuse SSH connections for speed; -o settings quiet the fresh-host prompts.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
